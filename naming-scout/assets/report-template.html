<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naming Scout report</title>
<style>
:root{
  --bg:#fcfbf9; --ink:#181712; --ink-2:#55524a; --ink-3:#8b877d;
  --rule:#e8e4db; --rule-2:#d8d3c8; --panel:#fff;
  --go:#2f6b4a; --hold:#9a6b1c; --no:#9a5148; --unk:#8b877d;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131310; --ink:#f2f0ea; --ink-2:#b5b1a7; --ink-3:#87837a;
  --rule:#2a2a24; --rule-2:#3a3a32; --panel:#1a1a16;
  --go:#7cc59d; --hold:#d9ab63; --no:#dd9186; --unk:#87837a;
}}
:root[data-theme="dark"]{
  --bg:#131310; --ink:#f2f0ea; --ink-2:#b5b1a7; --ink-3:#87837a;
  --rule:#2a2a24; --rule-2:#3a3a32; --panel:#1a1a16;
  --go:#7cc59d; --hold:#d9ab63; --no:#dd9186; --unk:#87837a;
}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 28px 120px}
code{font:0.92em var(--mono);color:var(--ink);white-space:nowrap}
strong{font-weight:600}

/* ---------- header ---------- */
header{padding:64px 0 0}
.eyebrow{font:500 11.5px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 20px}
h1{font:400 clamp(28px,5vw,40px)/1.15 var(--serif);margin:0;letter-spacing:-.015em}
.lede{color:var(--ink-2);margin:14px 0 0;font-size:17px;max-width:56ch}

/* ---------- the answer ---------- */
.verdict{margin-top:56px}
.pick{border-top:2px solid var(--ink);padding-top:22px}
.pick .lab{font:600 11px/1 var(--sans);letter-spacing:.15em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:14px}
.pick .name{font:400 clamp(38px,8vw,58px)/1 var(--serif);margin:0 0 4px;letter-spacing:-.02em}
.pick .pterr{font-size:13.5px;color:var(--ink-3);margin:0 0 18px}
.pick .why{font-size:17.5px;line-height:1.6;margin:0 0 22px;color:var(--ink)}
.pick .dom{display:flex;flex-wrap:wrap;gap:18px;margin:0 0 22px;font-size:16px}
.pick .dom .t{font-size:16px}
.pick .dom .s{font-size:13.5px}
.pick .dom .st::before{width:9px;height:9px}
.pick .caveat{font-size:15px;color:var(--ink-2);border-left:2px solid var(--rule-2);
  padding-left:14px;margin:0}
.pick .caveat b{font-weight:600;color:var(--ink-2)}

.alts{display:grid;grid-template-columns:1fr 1fr;gap:0 32px;margin-top:40px;
  border-top:1px solid var(--rule);padding-top:24px}
.alt{display:flex;flex-direction:column}
.alt .n{font:400 24px/1.2 var(--serif);margin:0 0 6px}
.alt .r{font-size:15px;color:var(--ink-2);margin:0 0 14px}
.alt .d{font-size:14px;margin:auto 0 0}

.extras{margin-top:32px;border-top:1px solid var(--rule);padding-top:20px;
  display:grid;gap:14px}
.extra{display:grid;grid-template-columns:118px 1fr;gap:16px;font-size:15px;align-items:baseline}
.extra dt{font:600 11px/1.7 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.extra dd{margin:0;color:var(--ink-2);max-width:56ch}
.extra dd b{color:var(--ink);font:500 16px var(--serif);font-weight:400}

/* ---------- state marks ---------- */
.st{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.st::before{content:"";width:8px;height:8px;border-radius:50%;flex:none;
  border:1.5px solid var(--unk);background:transparent}
.st .t{font-family:var(--mono);font-size:13.5px}
.st .s{font-size:12.5px;color:var(--ink-3)}
.st[data-s=available]::before,.st[data-s=free]::before{background:var(--go);border-color:var(--go)}
.st[data-s=available] .s,.st[data-s=free] .s{color:var(--go)}
.st[data-s=for_sale]::before{background:var(--hold);border-color:var(--hold)}
.st[data-s=for_sale] .s{color:var(--hold)}
.st[data-s=parked]::before{border-color:var(--hold)}
.st[data-s=parked] .s{color:var(--hold)}
.st[data-s=registered]::before,.st[data-s=taken]::before{border-color:var(--no)}
.st[data-s=registered] .s,.st[data-s=taken] .s{color:var(--no)}
.st[data-s=unknown]::before{border-style:dashed}
.st[data-conf=low] .s::after{content:" ?";font-weight:700}
.find{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.find::before{content:"";width:8px;height:8px;flex:none;border:1.5px solid var(--unk);
  border-radius:2px;transform:rotate(45deg)}
.find .t{font-size:13.5px;color:var(--ink-2)}
.find .s{font-size:12.5px;color:var(--ink-3)}
.find[data-g=ownable]::before{background:var(--go);border-color:var(--go)}
.find[data-g=ownable] .s{color:var(--go)}
.find[data-g=contested]::before{border-color:var(--hold)}
.find[data-g=contested] .s{color:var(--hold)}
.find[data-g=crowded]::before{border-color:var(--no)}
.find[data-g=crowded] .s{color:var(--no)}
.leak{margin:14px 0 0;padding-left:14px;border-left:2px solid var(--hold);font-size:14.5px;
  color:var(--ink-2)}
.leak b{color:var(--hold);font-weight:600}

/* ---------- shortlist ---------- */
section.block{margin-top:56px}
h2{font:600 11.5px/1 var(--sans);letter-spacing:.15em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 4px}
.blurb{color:var(--ink-3);font-size:14px;margin:0 0 18px}
.controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 6px}
.controls input{flex:1 1 180px;min-width:140px;padding:7px 0;font:15px var(--sans);
  color:var(--ink);background:none;border:0;border-bottom:1px solid var(--rule)}
.controls input:focus{outline:none;border-bottom-color:var(--ink)}
.tog{font:500 13px var(--sans);padding:5px 10px;border-radius:6px;cursor:pointer;
  background:none;color:var(--ink-3);border:1px solid transparent}
.tog:hover{color:var(--ink)}
.tog[aria-pressed=true]{color:var(--go);border-color:var(--rule-2)}
.count{font-size:13px;color:var(--ink-3);margin-left:auto}

.row{border-top:1px solid var(--rule)}
.row:last-of-type{border-bottom:1px solid var(--rule)}
.row summary{display:flex;align-items:baseline;gap:12px;padding:15px 0;cursor:pointer;
  list-style:none;position:relative;padding-right:22px}
.row summary::-webkit-details-marker{display:none}
.row summary::after{content:"";position:absolute;right:4px;top:22px;width:6px;height:6px;
  border-right:1.5px solid var(--ink-3);border-bottom:1.5px solid var(--ink-3);
  transform:rotate(45deg);transition:transform .15s}
.row[open] summary::after{transform:rotate(-135deg)}
.row summary:hover .nm{color:var(--go)}
.rk{font:500 13px var(--mono);color:var(--ink-3);min-width:20px;flex:none}
.nm{font:400 20px/1.3 var(--serif);flex:none}
.tg{font-size:13px;color:var(--ink-3);flex:1 1 auto;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.row summary .st{flex:none}
.body{padding:2px 0 22px 32px}
.f{margin:0 0 14px;font-size:15.5px;color:var(--ink-2)}
.f:last-child{margin-bottom:0}
.f b{display:block;font:600 10.5px/1.9 var(--sans);letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-3)}
.f.why{color:var(--ink)}
.marks{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:16px;padding-top:14px;
  border-top:1px solid var(--rule);font-size:14px}
.empty{color:var(--ink-3);font-style:italic;padding:22px 0;border-top:1px solid var(--rule)}

/* ---------- method (secondary) ---------- */
.method{margin-top:0}
.method>summary{list-style:none;cursor:pointer;padding:18px 0;
  font:600 11.5px/1 var(--sans);letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3)}
.method>summary::-webkit-details-marker{display:none}
.method>summary:hover{color:var(--ink)}
.method>summary::before{content:"+ ";font-family:var(--mono)}
.method[open]>summary::before{content:"– "}
.method .inner{padding:6px 0 34px}
h3{font:600 11px/1 var(--sans);letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);margin:32px 0 14px}
h3:first-child{margin-top:0}
.runmeta{margin:0 0 26px;font-size:14px;color:var(--ink-3)}
.brief{display:grid;gap:12px}
.brief div{display:grid;grid-template-columns:118px 1fr;gap:16px;font-size:15px}
.brief dt{font:600 10.5px/1.8 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.brief dd{margin:0;color:var(--ink-2)}
.assume{margin-top:18px;font-size:14.5px;color:var(--ink-2);
  border-left:2px solid var(--rule-2);padding-left:14px}
.terr{padding:14px 0;border-top:1px solid var(--rule)}
.terr:last-child{border-bottom:1px solid var(--rule)}
.terr .th{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.terr .tn{font:500 16px var(--sans)}
.terr .tr{font:500 13px var(--mono);color:var(--ink-3);margin-left:auto}
.terr p{margin:6px 0 0;font-size:14.5px;color:var(--ink-2);max-width:60ch}
.bar{height:3px;background:var(--rule);border-radius:2px;margin-top:10px;max-width:220px}
.bar i{display:block;height:100%;border-radius:2px;background:var(--unk)}
.terr[data-h=open] .bar i{background:var(--go)}
.terr[data-h=normal] .bar i{background:var(--hold)}
.terr[data-h=mined] .bar i{background:var(--no)}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font:600 10.5px/1 var(--sans);letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3);padding:0 14px 10px 0;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:11px 14px 11px 0;border-bottom:1px solid var(--rule);vertical-align:top;color:var(--ink-2)}
td.n{font-family:var(--mono);color:var(--ink)}

/* ---------- caveats ---------- */
.caveats{margin-top:0;border-top:1px solid var(--rule);padding-top:26px}
.caveats ul{margin:0;padding-left:18px;list-style:none}
.caveats li{position:relative;margin-bottom:12px;font-size:15px;color:var(--ink-2);max-width:62ch}
.caveats li::before{content:"";position:absolute;left:-18px;top:9px;width:6px;height:6px;
  border-radius:50%;border:1.5px solid var(--hold)}
.caveats li:last-child{margin-bottom:0}

footer{margin-top:64px;padding-top:18px;border-top:1px solid var(--rule);font-size:13px;
  color:var(--ink-3);display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between}
.themebtn{background:none;border:0;color:var(--ink-3);font:13px var(--sans);cursor:pointer;padding:0}
.themebtn:hover{color:var(--ink)}

@media (max-width:620px){
  .wrap{padding:0 20px 80px}
  .alts{grid-template-columns:1fr;gap:26px}
  .extra,.brief div{grid-template-columns:1fr;gap:2px}
  .body{padding-left:0}
  .nm{font-size:18px}
}
@media print{
  body{background:#fff;font-size:12pt}
  .controls,.themebtn,footer{display:none}
  .row,.method{break-inside:avoid}
  .method[open] .inner,.row .body{display:block}
  details{open:true}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow" id="eyebrow">Naming Scout</p>
    <h1 id="title">Naming report</h1>
    <p class="lede" id="lede"></p>
  </header>

  <div class="verdict" id="verdict" hidden>
    <div class="pick" id="pick"></div>
    <div class="alts" id="alts" hidden></div>
    <dl class="extras" id="extras" hidden></dl>
  </div>

  <section class="block" id="s-list" hidden>
    <h2>The shortlist</h2>
    <p class="blurb" id="blurb"></p>
    <div class="controls" id="controls" hidden>
      <input type="search" id="q" placeholder="Filter…" aria-label="Filter candidates">
      <button class="tog" id="f-avail" aria-pressed="false">Available only</button>
      <button class="tog" id="f-buy" aria-pressed="false">Or purchasable</button>
      <span class="count" id="count"></span>
    </div>
    <div id="rows"></div>
  </section>

  <details class="method" id="method" hidden>
    <summary>How these were found</summary>
    <div class="inner">
      <p class="runmeta" id="runmeta" hidden></p>
      <div id="m-brief" hidden><h3>Brief</h3><div class="brief" id="brief"></div>
        <p class="assume" id="assume" hidden></p></div>
      <div id="m-terr" hidden><h3>Territories</h3><div id="terrs"></div></div>
      <div id="m-rounds" hidden><h3>Rounds</h3>
        <table><thead><tr><th>#</th><th>Focus</th><th>Free</th><th>What it told us</th></tr></thead>
        <tbody id="rounds"></tbody></table></div>
    </div>
  </details>

  <section class="caveats" id="s-cav" hidden>
    <h2>Check these yourself</h2>
    <ul id="caveats"></ul>
  </section>

  <footer>
    <span id="foot"></span>
    <button class="themebtn" id="theme">Toggle theme</button>
  </footer>
</div>

<script type="application/json" id="data">__NAMING_SCOUT_DATA__</script>
<script>
(function(){
  var D={};
  try{ D=JSON.parse(document.getElementById('data').textContent)||{} }
  catch(e){ document.body.innerHTML='<div class="wrap"><h1>Report data could not be parsed</h1><pre>'+
    String(e)+'</pre></div>'; return }

  var el=function(i){return document.getElementById(i)};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  var rich=function(s){return esc(s)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|\W)\*([^*\n]+)\*/g,'$1<em>$2</em>')};
  var show=function(i){var n=el(i); if(n) n.hidden=false};
  var norm=function(s){var v=String(s||'unknown').toLowerCase().replace(/[\s-]+/g,'_');
    return v.indexOf('unknown')===0||v==='error'?'unknown':v};

  var mark=function(label,state,detail,conf){
    var s=norm(state);
    return '<span class="st" data-s="'+esc(s)+'"'+(conf?' data-conf="'+esc(norm(conf))+'"':'')+
      ' title="'+esc([label,state,detail].filter(Boolean).join(': '))+'">'+
      '<span class="t">'+esc(label)+'</span><span class="s">'+esc(state)+'</span></span>';
  };

  var find_mark=function(f){
    if(!f||!f.grade) return '';
    return '<span class="find" data-g="'+esc(norm(f.grade))+'" title="'+
      esc('Searchability: '+f.grade+(f.note?'. '+f.note:''))+'">'+
      '<span class="t">search</span><span class="s">'+esc(f.grade)+'</span></span>';
  };

  var C=D.candidates||[];
  var byName={}; C.forEach(function(c){ if(c.name) byName[String(c.name).toLowerCase()]=c });
  var find=function(n){ return byName[String(n||'').toLowerCase()] };
  // the domain worth showing: the one you could actually act on
  var best=function(c){
    if(!c||!c.domains||!c.domains.length) return null;
    var pref=['available','for_sale','parked','registered'];
    for(var i=0;i<pref.length;i++){
      for(var j=0;j<c.domains.length;j++) if(norm(c.domains[j].state)===pref[i]) return c.domains[j];
    }
    return c.domains[0];
  };

  // ---------- header
  var title=D.title||'Naming report';
  document.title=title+' | Naming Scout';
  el('title').textContent=title;
  if(D.subtitle) el('lede').textContent=D.subtitle;
  var eb=['Naming Scout']; if(D.date) eb.push(D.date);
  el('eyebrow').textContent=eb.join(' · ');

  // ---------- the answer, first
  var top=(D.top3||[]).slice(0,3);
  var lead=top[0]||(C.length?{name:C[0].name,reason:C[0].why,dealbreaker:C[0].weakness}:null);
  if(lead&&lead.name){
    var lc=find(lead.name)||{}, bd=best(lc);
    el('pick').innerHTML=
      '<div class="lab">'+(top.length?'The pick':'Top candidate')+'</div>'+
      '<p class="name">'+esc(lead.name)+'</p>'+
      (lc.territory?'<p class="pterr">'+esc(lc.territory)+'</p>':'')+
      (lead.reason||lc.why?'<p class="why">'+rich(lead.reason||lc.why)+'</p>':'')+
      (bd||lc.searchability?'<p class="dom">'+(bd?mark(bd.domain,bd.state,bd.detail):'')+
        find_mark(lc.searchability)+'</p>':'')+
      (lead.dealbreaker?'<p class="caveat"><b>Would change my mind:</b> '+
        rich(lead.dealbreaker)+'</p>':'');
    show('verdict');
  }
  if(top.length>1){
    el('alts').innerHTML=top.slice(1).map(function(p){
      var c=find(p.name)||{}, bd=best(c);
      return '<div class="alt"><p class="n">'+esc(p.name)+'</p>'+
        (p.reason?'<p class="r">'+rich(p.reason)+'</p>':'')+
        (bd?'<p class="d">'+mark(bd.domain,bd.state,bd.detail)+'</p>':'')+'</div>';
    }).join('');
    el('alts').hidden=false;
  }
  var ex=[];
  if(D.unconventional&&D.unconventional.name) ex.push(['Boldest bet',D.unconventional]);
  if(D.safest&&D.safest.name) ex.push(['Safest bet',D.safest]);
  if(ex.length){
    el('extras').innerHTML=ex.map(function(e){
      return '<div class="extra"><dt>'+esc(e[0])+'</dt><dd><b>'+esc(e[1].name)+'</b>'+
        (e[1].reason?'. '+rich(e[1].reason):'')+'</dd></div>'}).join('');
    el('extras').hidden=false;
  }
  var picked={}; top.forEach(function(p){ if(p.name) picked[String(p.name).toLowerCase()]=1 });

  // ---------- shortlist, collapsed by default
  var render=function(list){
    if(!list.length){ el('rows').innerHTML='<p class="empty">No names match that filter.</p>'; return }
    el('rows').innerHTML=list.map(function(c,i){
      var bd=best(c);
      var marks=(c.domains||[]).map(function(d){return mark(d.domain,d.state,d.detail)})
        .concat((c.clearance||[]).map(function(x){return mark(x.check,x.state,x.detail,x.confidence)}));
      var body='';
      if(c.why)      body+='<p class="f why"><b>Why it works</b>'+rich(c.why)+'</p>';
      if(c.weakness) body+='<p class="f"><b>Weakness</b>'+rich(c.weakness)+'</p>';
      if(c.searchability&&c.searchability.note)
        body+='<p class="f"><b>Searchability</b>'+rich(c.searchability.note)+'</p>';
      if(c.canonical&&c.canonical.spelling){
        var cn=c.canonical;
        body+='<p class="leak"><b>Spelled the usual way:</b> '+
          rich(cn.spelling)+(cn.domain?' ('+esc(cn.domain)+', '+esc(cn.state||'unchecked')+
          (cn.detail?'. '+esc(cn.detail):'')+')':'')+
          '. That is the spelling people will type.</p>';
      }
      if(c.verdict)  body+='<p class="f"><b>Verdict</b>'+rich(c.verdict)+'</p>';
      if(c.searchability&&c.searchability.grade) marks.push(find_mark(c.searchability));
      if(marks.length) body+='<div class="marks">'+marks.join('')+'</div>';
      return '<details class="row"'+(picked[String(c.name).toLowerCase()]?' data-pick="1"':'')+'>'+
        '<summary><span class="rk">'+(c.rank||i+1)+'</span>'+
        '<span class="nm">'+esc(c.name)+'</span>'+
        '<span class="tg">'+esc(c.territory||'')+'</span>'+
        (bd?mark(bd.domain,bd.state,bd.detail):'')+'</summary>'+
        '<div class="body">'+(body||'<p class="f">No notes recorded for this name.</p>')+'</div></details>';
    }).join('');
  };
  var hasState=function(c,ss){return (c.domains||[]).some(function(d){return ss.indexOf(norm(d.state))>-1})};
  var apply=function(){
    var q=el('q').value.trim().toLowerCase();
    var a=el('f-avail').getAttribute('aria-pressed')==='true';
    var b=el('f-buy').getAttribute('aria-pressed')==='true';
    var list=C.filter(function(c){
      if(a&&!hasState(c,['available'])) return false;
      if(b&&!hasState(c,['available','for_sale','parked'])) return false;
      return !q||JSON.stringify(c).toLowerCase().indexOf(q)>-1;
    });
    render(list);
    el('count').textContent=list.length===C.length?'':list.length+' of '+C.length;
  };
  if(C.length){
    el('blurb').textContent='Ranked. Open a name to see why it works and every check that was run.';
    if(C.length>6){
      el('controls').hidden=false;
      ['f-avail','f-buy'].forEach(function(id){
        el(id).addEventListener('click',function(){
          var on=this.getAttribute('aria-pressed')==='true';
          this.setAttribute('aria-pressed',String(!on));
          if(!on) el(id==='f-avail'?'f-buy':'f-avail').setAttribute('aria-pressed','false');
          apply();
        });
      });
      el('q').addEventListener('input',apply);
    }
    apply();
    show('s-list');
  }

  // ---------- method, folded away
  var any=false;
  var rm=[];
  if(D.domain_mode)        rm.push('Domain mode: '+D.domain_mode);
  if(D.clearance_profile)  rm.push('Checks run: '+D.clearance_profile);
  if(rm.length){ el('runmeta').textContent=rm.join('  ·  '); el('runmeta').hidden=false; any=true }
  var b=D.brief||{};
  var order=[['naming','Naming'],['does','What it does'],['audience','Audience'],
             ['positioning','Positioning'],['personality','Personality'],['constraints','Constraints']];
  var seen={}, bh='';
  order.forEach(function(k){ if(b[k[0]]){ seen[k[0]]=1;
    bh+='<div><dt>'+esc(k[1])+'</dt><dd>'+rich(b[k[0]])+'</dd></div>' }});
  Object.keys(b).forEach(function(k){ if(!seen[k])
    bh+='<div><dt>'+esc(k.replace(/_/g,' '))+'</dt><dd>'+rich(b[k])+'</dd></div>' });
  if(bh){ el('brief').innerHTML=bh; show('m-brief'); any=true }
  if(D.assumptions&&D.assumptions.length){
    el('assume').innerHTML='<strong>Assumed:</strong> '+D.assumptions.map(rich).join(' · ');
    el('assume').hidden=false; show('m-brief'); any=true;
  }
  var T=D.territories||[];
  if(T.length){
    el('terrs').innerHTML=T.map(function(t){
      var ch=Number(t.checked)||0, av=Number(t.available)||0;
      var pct=ch?Math.round(av/ch*100):null;
      var h=pct==null?'':(pct>=40?'open':(pct>=15?'normal':'mined'));
      return '<div class="terr" data-h="'+h+'"><div class="th"><span class="tn">'+esc(t.name)+'</span>'+
        (ch?'<span class="tr">'+av+'/'+ch+' free'+(t.note?'. '+esc(t.note):'')+'</span>':
            (t.note?'<span class="tr">'+esc(t.note)+'</span>':''))+'</div>'+
        (t.fit||t.description?'<p>'+rich(t.fit||t.description)+'</p>':'')+
        (ch?'<div class="bar"><i style="width:'+Math.max(pct,2)+'%"></i></div>':'')+'</div>';
    }).join('');
    show('m-terr'); any=true;
  }
  var R=D.rounds||[];
  if(R.length){
    el('rounds').innerHTML=R.map(function(r){
      var ch=Number(r.checked)||0, av=Number(r.available)||0;
      return '<tr><td class="n">'+esc(r.round)+'</td><td>'+rich(r.focus||'')+'</td>'+
        '<td class="n">'+(ch?av+'/'+ch+' ('+Math.round(av/ch*100)+'%)':'-')+'</td>'+
        '<td>'+rich(r.note||'')+'</td></tr>';
    }).join('');
    show('m-rounds'); any=true;
  }
  if(any) show('method');

  // ---------- caveats
  var V=D.unverified||[];
  if(V.length){ el('caveats').innerHTML=V.map(function(x){return '<li>'+rich(x)+'</li>'}).join(''); show('s-cav') }

  el('foot').textContent=(D.date?'Checked '+D.date+'. ':'')+
    'Domain states change. Re-run before you register. This is not legal advice.';

  var t=el('theme');
  try{ var sv=localStorage.getItem('ns-theme'); if(sv) document.documentElement.setAttribute('data-theme',sv) }catch(e){}
  t.addEventListener('click',function(){
    var cur=document.documentElement.getAttribute('data-theme');
    var next=cur==='dark'?'light':(cur==='light'?'dark':
      (matchMedia('(prefers-color-scheme: dark)').matches?'light':'dark'));
    document.documentElement.setAttribute('data-theme',next);
    try{ localStorage.setItem('ns-theme',next) }catch(e){}
  });
  // print: expand everything
  window.addEventListener('beforeprint',function(){
    document.querySelectorAll('details').forEach(function(d){ d.dataset.wasOpen=d.open?'1':''; d.open=true })});
  window.addEventListener('afterprint',function(){
    document.querySelectorAll('details').forEach(function(d){ d.open=d.dataset.wasOpen==='1' })});
})();
</script>
</body>
</html>
